<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Happy Moodboard</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="mood-page happy">
    <div class="grid-wrapper">
      <main id="moodboard" class="happy">
        <div class="grid">
          <!-- Row 1 -->
            <div class="grid-item big-square" style="grid-column: 3 / span 2; grid-row: 1 / span 2;">
              <img src="images/hap1.jpg" alt="">
            </div>
            <div class="grid-item big-square" style="grid-column: 6 / span 2; grid-row: 1 / span 2;">
              <img src="images/hap2.jpg" alt="">
            </div>
    
          <!-- Row 2 -->
    
          <!-- Row 3 -->
            <div class="grid-item vertical-rect" style="grid-column: 1; grid-row: 3 / span 2;">
              <img src="images/hap3.jpg" alt="">
            </div>
            <div class="grid-item vertical-rect" style="grid-column: 9; grid-row: 3 / span 2;">
              <img src="images/hap4.jpg" alt="">
            </div>
          
          <!-- Row 4 -->
            <div class="grid-item horizontal-rect" style="grid-column: 2 / span 2; grid-row: 4;">
              <img src="images/hap5.jpg" alt="">
            </div>
            <div class="grid-item horizontal-rect" style="grid-column: 4 / span 2; grid-row: 4;">
              <img src="images/hap6.jpg" alt="">
            </div>
            <div class="grid-item horizontal-rect" style="grid-column: 6 / span 2; grid-row: 4;">
              <img src="images/hap7.jpg" alt="">
            </div>
            <div class="grid-item vertical-rect" style="grid-column: 8; grid-row: 4 / span 2;">
              <img src="images/hap8.jpg" alt="">
            </div>  
          
          <!-- Row 5 -->
            <div class="grid-item small-square" style="grid-column: 2; grid-row: 5;">
              <img src="images/hap9.jpg" alt="">
            </div>
          
          <!-- Row 6 -->
            <div class="grid-item small-square" style="grid-column: 3; grid-row: 6;">
              <img src="images/hap10.jpg" alt="">
            </div>
            <div class="grid-item small-square" style="grid-column: 7; grid-row: 6;">
              <img src="images/hap11.jpg" alt="">
            </div>
            
          <!-- Row 7 -->
          <div class="grid-item small-square" style="grid-column: 4; grid-row: 7;">
              <img src="images/hap12.jpg" alt="">
            </div>
          <div class="grid-item horizontal-rect" style="grid-column: 5 / span 2; grid-row: 7;">
              <img src="images/hap13.jpg" alt="">
          </div>
          
        </div>
      </main>
    </div>
  <!-- Control bar -->
  <nav id="control-bar">
    <a href="index.html" class="nav-item home">Home</a>
  
    <!-- Mood dropdown -->
    <div class="nav-item dropdown">
      Mood
      <div class="dropdown-content">
        <a href="romantic.html">Romantic</a>
        <a href="happy.html">Happy</a>
        <a href="calm.html">Calm</a>
      </div>
    </div>
  
    <div class="nav-item theme">Theme</div>
    <div class="nav-item search">Search</div>
  </nav>
</div>
</body>
</html>
