<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Romantic Moodboard</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="mood-page romantic">
    <div class="grid-wrapper">
      <main id="moodboard" class="romantic">
        <div class="grid">
          <!-- Row 1 -->
            <div class="grid-item horizontal-rect" style="grid-column: 2 / span 2; grid-row: 1;">
              <img src="images/rom1.jpg" alt="">
            </div>
            <div class="grid-item horizontal-rect" style="grid-column: 7 / span 2; grid-row: 1;">
              <img src="images/rom2.jpg" alt="">
            </div>
    
          <!-- Row 2 -->
            <div class="grid-item vertical-rect" style="grid-column: 1; grid-row: 2 / span 2;">
              <img src="images/rom3.jpg" alt="">
            </div>
            <div class="grid-item big-square" style="grid-column: 2 / span 2; grid-row: 2 / span 2;">
              <img src="images/rom4.jpg" alt="">
            </div>
            <div class="grid-item small-square" style="grid-column: 4; grid-row: 2;">
              <img src="images/rom5.jpg" alt="">
            </div>
            <div class="grid-item big-square" style="grid-column: 6 / span 2; grid-row: 2 / span 2;">
              <img src="images/rom6.jpg" alt="">
            </div>
            <div class="grid-item big-square" style="grid-column: 8 / span 2; grid-row: 2 / span 2;">
              <img src="images/rom7.jpg" alt="">
            </div>
    
          <!-- Row 3 -->
            <div class="grid-item horizontal-rect" style="grid-column: 4 / span 2; grid-row: 3;">
              <img src="images/rom8.jpg" alt="">
            </div>
          
          <!-- Row 4 -->
            <div class="grid-item horizontal-rect" style="grid-column: 2 / span 2; grid-row: 4;">
              <img src="images/rom9.jpg" alt="">
            </div>
            <div class="grid-item big-square" style="grid-column: 4 / span 2; grid-row: 4 / span 2;">
              <img src="images/rom10.jpg" alt="">
            </div>
            <div class="grid-item big-square" style="grid-column: 6 / span 2; grid-row: 4 / span 2;">
              <img src="images/rom11.jpg" alt="">
            </div>
            <div class="grid-item small-square" style="grid-column: 8; grid-row: 4;">
              <img src="images/rom12.jpg" alt="">
            </div>
          
          <!-- Row 5 -->
            <div class="grid-item small-square" style="grid-column: 3; grid-row: 5;">
              <img src="images/rom13.jpg" alt="">
            </div>
          
          <!-- Row 6-->
            <div class="grid-item small-square" style="grid-column: 4; grid-row: 6;">
              <img src="images/rom14.jpg" alt="">
            </div>
            <div class="grid-item vertical-rect" style="grid-column: 5; grid-row: 6 / span 2;">
              <img src="images/rom15.jpg" alt="">
            </div>
            <div class="grid-item small-square" style="grid-column: 6; grid-row: 6;">
              <img src="images/rom16.jpg" alt="">
            </div>
        </div>
      </main>
    </div>
  <!-- Control bar -->
  <nav id="control-bar">
    <a href="index.html" class="nav-item home">Home</a>
  
    <!-- Mood dropdown -->
    <div class="nav-item dropdown">
      Mood
      <div class="dropdown-content">
        <a href="romantic.html">Romantic</a>
        <a href="#">Happy</a>
        <a href="#">Calm</a>
      </div>
    </div>
  
    <div class="nav-item theme">Theme</div>
    <div class="nav-item search">Search</div>
  </nav>
</div>
</body>
</html>
